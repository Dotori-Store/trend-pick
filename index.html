<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Onepick Trend" />
    <title>Onepick Trend</title>
    <style>
      :root {
        --bg: #eceef3;
        --panel: #ffffff;
        --text: #111111;
        --muted: #4b5563;
        --line: #d9dfe8;
        --accent: #1e3a8a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 360px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        padding: 42px 28px 48px;
      }

      .date {
        text-align: center;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 18px 0 30px;
      }

      .rule {
        width: 44px;
        height: 3px;
        margin: 0 auto 24px;
        background: #e7ebf0;
        border-radius: 999px;
      }

      ol {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
      }

      .rank {
        font-size: 18px;
        font-weight: 700;
        color: #000;
      }

      .keyword {
        font-size: 18px;
        color: var(--accent);
        line-height: 1.25;
      }

      .loading,
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .meta {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="date" id="todayText">로딩 중</div>
      <div class="rule"></div>
      <div id="listArea" class="loading">데이터를 불러오는 중입니다.</div>
      <div class="meta" id="metaText"></div>
    </main>

    <script>
      const todayText = document.getElementById("todayText");
      const listArea = document.getElementById("listArea");
      const metaText = document.getElementById("metaText");

      const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];
      const now = new Date();
      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      const today = yesterday.toISOString().slice(0, 10);
      const weekday = weekdayNames[yesterday.getDay()];
      todayText.textContent = `${today}.(${weekday})`;

      function sortByRatioDesc(rows) {
        return [...rows].sort((a, b) => Number(b.ratio ?? -1) - Number(a.ratio ?? -1));
      }

      function flattenRows(results) {
        return results.flatMap((item) => {
          const rows = Array.isArray(item.data) ? item.data : [];
          return rows.map((row) => ({
            title: item.title,
            category: Array.isArray(item.category) ? item.category.join(", ") : item.category,
            ...row,
          }));
        });
      }

      function renderList(rows) {
        if (!rows.length) {
          listArea.className = "empty";
          listArea.textContent = "표시할 데이터가 없습니다.";
          return;
        }

        listArea.className = "";
        listArea.innerHTML = `
          <ol>
            ${rows
              .map(
                (row, index) => `
                  <li>
                    <div class="rank">${index + 1}</div>
                    <div class="keyword">${row.title || row.category || "-"}${row.ratio !== undefined ? ` <span style="color:#6b7280;font-size:14px;">(${row.ratio})</span>` : ""}</div>
                  </li>
                `,
              )
              .join("")}
          </ol>
        `;
      }

      fetch("/api/category")
        .then((response) => response.json())
        .then((data) => {
          const results = Array.isArray(data.responses?.categories?.data?.results)
            ? data.responses.categories.data.results
            : [];
          const rows = sortByRatioDesc(flattenRows(results)).slice(0, 10);
          renderList(rows);
          metaText.textContent = `${data.categoryName || "-"} · ${data.categoryId || "-"}`;
        })
        .catch(() => {
          listArea.className = "empty";
          listArea.textContent = "API 응답을 가져오지 못했습니다.";
        });
    </script>
  </body>
</html>
